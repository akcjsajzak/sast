name: build

on:
  push:
    branches: ["**"]
    # A version tag (v1.0.0) builds and publishes a GitHub release.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(python -c "import sast; print(sast.__version__)")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match sast.__version__ $VERSION"
            exit 1
          fi

      - name: Run unit tests
        run: python -m unittest tests.test_sast

      - name: Download vulnerability feeds
        run: python -m sast.fetch_feeds --ecosystems Packagist Maven npm PyPI Go NuGet -o sast/data/advisories/downloaded.json

      - name: Build executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=';'; else SEP=':'; fi
          # Grammars to bundle, derived from requirements.txt rather than
          # listed by hand so adding a language cannot leave the list stale.
          # PyInstaller's import analysis does find these on its own today;
          # collecting them explicitly also brings along any package data a
          # grammar ships separately, which is not guaranteed to be found.
          COLLECT=()
          while read -r pkg; do
            [ -n "$pkg" ] && COLLECT+=(--collect-all "$pkg")
          done < <(grep -oE '^tree_sitter[a-z_0-9]*' requirements.txt)
          echo "Collecting grammars: ${COLLECT[*]}"
          python -m PyInstaller --onefile --clean --name sast \
            "${COLLECT[@]}" \
            --add-data "sast/data/advisories${SEP}sast/data/advisories" \
            sast/__main__.py

      # The unit tests exercise the Python package, so nothing they do says
      # whether the binary works: a grammar or data file missing from the
      # bundle would pass them and still fail for users. This runs the built
      # executable against one vulnerable file per engine.
      - name: Smoke-test the built executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/sast.exe; else BIN=dist/sast; fi
          python tests/smoke_binary.py "$BIN"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: sast-${{ matrix.os }}
          path: dist/sast*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package executables
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir release
          # Artifacts do not keep the executable bit; a tarball does.
          chmod +x artifacts/sast-ubuntu-latest/sast
          tar -czf "release/sast-${VERSION}-linux-x86_64.tar.gz" \
            -C artifacts/sast-ubuntu-latest sast
          (cd artifacts/sast-windows-latest && \
            zip -q "../../release/sast-${VERSION}-windows-x86_64.zip" sast.exe)
          (cd release && sha256sum * > SHA256SUMS)

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (found) exit; found = ($2 == v); next }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "sast ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
