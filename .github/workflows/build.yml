name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Run unit tests
        run: python -m unittest tests.test_sast

      - name: Download vulnerability feeds
        run: python -m sast.fetch_feeds --ecosystems Packagist Maven npm PyPI Go NuGet -o sast/data/advisories/downloaded.json

      - name: Build executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=';'; else SEP=':'; fi
          # Grammars to bundle, derived from requirements.txt rather than
          # listed by hand so adding a language cannot leave the list stale.
          # PyInstaller's import analysis does find these on its own today;
          # collecting them explicitly also brings along any package data a
          # grammar ships separately, which is not guaranteed to be found.
          COLLECT=()
          while read -r pkg; do
            [ -n "$pkg" ] && COLLECT+=(--collect-all "$pkg")
          done < <(grep -oE '^tree_sitter[a-z_0-9]*' requirements.txt)
          echo "Collecting grammars: ${COLLECT[*]}"
          python -m PyInstaller --onefile --clean --name sast \
            "${COLLECT[@]}" \
            --add-data "sast/data/advisories${SEP}sast/data/advisories" \
            sast/__main__.py

      # The unit tests exercise the Python package, so nothing they do says
      # whether the binary works: a grammar or data file missing from the
      # bundle would pass them and still fail for users. This runs the built
      # executable against one vulnerable file per engine.
      - name: Smoke-test the built executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/sast.exe; else BIN=dist/sast; fi
          python tests/smoke_binary.py "$BIN"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: sast-${{ matrix.os }}
          path: dist/sast*
          if-no-files-found: error
