[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sast"
version = "1.0.0"
description = "Offline framework-aware static application security testing, SCA, IaC, container and secrets scanning"
requires-python = ">=3.10"
dependencies = [
    "tree_sitter==0.25.2",
    "tree_sitter_php==0.25.1",
    "tree_sitter_java==0.23.5",
    "tree_sitter_javascript==0.25.0",
    "tree_sitter_typescript==0.23.2",
    "tree_sitter_python==0.25.0",
    "tree_sitter_go==0.25.0",
    "tree_sitter_c_sharp==0.23.5",
    "tree_sitter_c==0.24.2",
    "tree_sitter_cpp==0.23.4",
]

[project.scripts]
sast = "sast.cli:main"

[tool.setuptools.packages.find]
include = ["sast*"]

[tool.setuptools.package-data]
"sast" = ["data/advisories/*.json"]
